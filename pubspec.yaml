name: bhagwa
description: "Daivik Devotional Mobile App."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.5.0
  google_fonts: ^8.2.1
  audioplayers: ^6.8.1
  share_plus: ^13.3.0
  intl: ^0.20.3
  flutter_animate: ^4.5.2
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.8.0
  google_sign_in: ^6.2.2
  http: ^1.3.0
  facebook_app_events: ^0.19.2
  firebase_core: ^3.12.0
  firebase_analytics: ^11.4.3
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/daivik_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
